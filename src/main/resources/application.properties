# ==========================================================
# RestockRadar - application configuration
# ==========================================================

spring.application.name=RestockRadar

# ---------- Server ----------
server.port=8080

# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/restockradar_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=ashrith6965

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.restockradar=DEBUG
