<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productForm.productId != null ? 'Edit product — RestockRadar' : 'Add product — RestockRadar'}">Add
        product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="app-shell">
        <div th:replace="~{fragments/sidebar :: sidebar('products')}"></div>

        <div class="main">
            <div class="page-header">
                <div>
                    <div class="page-eyebrow">Catalog</div>
                    <h1 th:text="${productForm.productId != null ? 'Edit product' : 'Add product'}">Add product</h1>
                    <p class="subtitle">This is a one-time setup — you won't need to re-enter this later.</p>
                </div>
            </div>

            <div class="form-card">
                <form
                    th:action="${productForm.productId != null ? '/products/' + productForm.productId + '/edit' : '/products/new'}"
                    th:object="${productForm}" method="post">

                    <div class="form-row">
                        <label for="productName">Product name</label>
                        <input type="text" id="productName" th:field="*{productName}"
                            placeholder="e.g. Parle-G Biscuit 100g">
                        <div class="field-error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}">
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="categoryId">Category</label>
                        <select id="categoryId" th:field="*{categoryId}">
                            <option value="">— No category —</option>
                            <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}">
                                Category</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="supplierId">Supplier</label>
                        <select id="supplierId" th:field="*{supplierId}">
                            <option value="">— No supplier —</option>
                            <option th:each="s : ${suppliers}" th:value="${s.supplierId}" th:text="${s.supplierName}">
                                Supplier</option>
                        </select>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-row">
                            <label for="costPrice">Cost price (₹)</label>
                            <input type="number" step="0.01" id="costPrice" th:field="*{costPrice}" placeholder="0.00">
                            <div class="field-error" th:if="${#fields.hasErrors('costPrice')}" th:errors="*{costPrice}">
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="sellingPrice">Selling price (₹)</label>
                            <input type="number" step="0.01" id="sellingPrice" th:field="*{sellingPrice}"
                                placeholder="0.00">
                            <div class="field-error" th:if="${#fields.hasErrors('sellingPrice')}"
                                th:errors="*{sellingPrice}"></div>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-row">
                            <label for="currentStock">Current stock (units)</label>
                            <input type="number" id="currentStock" th:field="*{currentStock}" placeholder="0">
                            <div class="field-error" th:if="${#fields.hasErrors('currentStock')}"
                                th:errors="*{currentStock}"></div>
                        </div>
                        <div class="form-row">
                            <label for="minimumStock">Minimum stock (reorder trigger)</label>
                            <input type="number" id="minimumStock" th:field="*{minimumStock}" placeholder="0">
                            <div class="field-error" th:if="${#fields.hasErrors('minimumStock')}"
                                th:errors="*{minimumStock}"></div>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="form-row">
                            <label for="barcode">Barcode (optional)</label>
                            <input type="text" id="barcode" th:field="*{barcode}" placeholder="Leave blank if none">
                        </div>
                        <div class="form-row">
                            <label for="batchNumber">Batch Number (optional)</label>
                            <input type="text" id="batchNumber" th:field="*{batchNumber}"
                                placeholder="e.g. BATCH-2026-X">
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="expiryDate">Expiry date (optional)</label>
                        <input type="date" id="expiryDate" th:field="*{expiryDate}">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-accent"
                            th:text="${productForm.productId != null ? 'Save changes' : 'Add product'}">Add
                            product</button>
                        <a th:href="@{/products}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
